services:
  - type: web
    name: nirdhoom-dispatch
    runtime: python
    rootDir: services/dispatch-ortools
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DISPATCH_SERVICE_TOKEN
        sync: false
