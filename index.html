<!doctype html>
<html lang="en" style="background:#03060f;color-scheme:dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#03060f"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="description" content="NIRDHOOM — farmer-first crop residue clearance, dispatch, verification and offtake network."/>
  <title>NIRDHOOM — Field Operations Network</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html,body,#root{min-height:100%;margin:0}
    body{min-height:100vh;background:#03060f}
    #root{min-height:100vh}
    .boot-shell{min-height:100vh;display:grid;place-items:center;background:#03060f;color:#94a3b8;font:500 13px system-ui,sans-serif}
    .boot-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(15,23,42,.65)}
    .boot-dot{width:7px;height:7px;border-radius:999px;background:#34d399;box-shadow:0 0 12px rgba(52,211,153,.65)}
  </style>
</head>
<body>
  <div id="root"><div class="boot-shell" aria-label="Loading NIRDHOOM"><div class="boot-card"><span class="boot-dot"></span><span>Loading NIRDHOOM operations…</span></div></div></div>
  <noscript><div class="boot-shell"><div class="boot-card">NIRDHOOM requires JavaScript to run the operations console.</div></div></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
