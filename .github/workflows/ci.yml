name: NIRDHOOM CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/dispatch-ortools/requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npm run syntaxcheck
      - run: npm run audit
      - run: npm test
      - run: npm run build
      - name: Check dispatch service Python syntax
        run: python -m compileall -q services/dispatch-ortools
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
